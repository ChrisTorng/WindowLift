name: build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build WindowLift.sln --configuration Release
      - run: dotnet run --project tests/WindowLift.Core.SmokeTests --configuration Release --no-build
      - name: Publish self-contained Windows x64 build
        run: >-
          dotnet publish src/WindowLift.App/WindowLift.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/WindowLift-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: WindowLift-win-x64
          path: artifacts/WindowLift-win-x64/WindowLift.exe
          if-no-files-found: error
          retention-days: 14
