name: build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build WindowLift.sln --configuration Release
      - run: dotnet run --project tests/WindowLift.Core.SmokeTests --configuration Release --no-build
      - name: Publish self-contained Windows x64 build
        run: >-
          dotnet publish src/WindowLift.App/WindowLift.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/WindowLift-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: WindowLift-win-x64
          path: artifacts/WindowLift-win-x64/WindowLift.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish v0.1 Windows executable to GitHub Releases
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'artifacts/WindowLift-v0.1-win-x64.zip'
          Compress-Archive -Path 'artifacts/WindowLift-win-x64/WindowLift.exe' -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowLift-v0.1-win-x64.zip" | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding ascii
          gh release view v0.1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1 --target $env:GITHUB_SHA --title 'WindowLift v0.1' --notes 'Self-contained Windows x64 build. No separate .NET installation required. Unsigned executable.'
          }
          gh release upload v0.1 $zip 'artifacts/SHA256SUMS.txt' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
